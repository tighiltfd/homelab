apiVersion: v1
kind: Service
metadata:
  labels:
    app: mealie
  name: mealie
  namespace: mealie
spec:
  type: NodePort
  selector:
    app: mealie
  ports:
    - name: http
      port: 9000 # ClusterIP
      targetPort: 9000 # container port in the pod
      nodePort: 30900 # port exposed on every node
      protocol: TCP
